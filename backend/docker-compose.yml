services:
  app:
    build: .
    ports:
      - "3005:3005"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/myapp
    depends_on:
      - mongo
    networks:
      - app-network

  mongo:
    image: mongo:latest
    restart: always
  #  ports:
  #    - "27017:27017"
    volumes:
      - ./mongo-data:/data/db
    networks:
      - app-network
  #mongo-express:
  #  image: mongo-express:latest
  #  restart: always
  #  ports:
  #    - "8081:8081"
  #  environment:
  #    - ME_CONFIG_MONGODB_SERVER=mongo
  #    - ME_CONFIG_MONGODB_PORT=27017
  #    - ME_CONFIG_BASICAUTH_USERNAME=admin
  #    - ME_CONFIG_BASICAUTH_PASSWORD=pass
  #  depends_on:
  #    - mongo
  #  networks:
  #    - app-network
networks:
  app-network:
    driver: bridge